name: CI

# デプロイには使わない（Cloudflare Workers Builds が main への push を検知して行う）。
# ここでは PR と main への push を対象に、ノートの frontmatter・型・ビルドを検証するだけ。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run notes:check
      - run: bun run check
      - run: bun run build
