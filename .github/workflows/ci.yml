name: CI

# デプロイには使わない（Cloudflare Workers Builds が main への push を検知して行う）。
# ここでは PR と main への push を対象に、ノートの frontmatter・型・ビルドを検証するだけ。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run notes:check
      - run: bun run check
      - run: bun run build
